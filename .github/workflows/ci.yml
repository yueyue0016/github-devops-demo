name: CI - 构建与测试

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    name: 代码检查
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 语法检查
        run: |
          for f in $(find src test -name '*.js'); do
            node --check "$f" && echo "OK: $f"
          done

  test:
    name: 单元测试
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 安装依赖
        run: npm install --no-audit
      - name: 运行单元测试
        run: npm test

  build:
    name: 构建镜像(验证)
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 构建 Docker 镜像
        run: docker build -t order-service:${{ github.sha }} .
      - name: 冒烟测试
        run: |
          docker run -d --rm -p 3000:3000 --name smoke order-service:${{ github.sha }}
          sleep 3
          curl -sf http://localhost:3000/health
          docker stop smoke
